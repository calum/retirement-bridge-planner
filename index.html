<style>
/* Layout concept: one calm column of large-type cards; a sticky bar holds the page tabs and the

  --bg:#f1f5f7; --surface:#ffffff; --surface-2:#e8eff3; --ink:#11222d; --muted:#44586a; --line:#d3dde4;
  --accent:#0d6677; --accent-ink:#ffffff; --accent-soft:#d9eef2; --focus:#0b57d0;
  --good:#17703f; --good-soft:#dcf3e5; --warn:#8f5700; --warn-soft:#fbecc9; --bad:#b3261e; --bad-soft:#fbe0dd;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c7:#6250d6;
  --shadow:0 1px 2px rgba(17,34,45,.06),0 4px 14px rgba(17,34,45,.05);
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-display:Georgia,"Iowan Old Style","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d171d; --surface:#15232b; --surface-2:#1d2f39; --ink:#e9f0f4; --muted:#a8bac6; --line:#2a3f4b;
  --accent:#5cc4d6; --accent-ink:#06222a; --accent-soft:#17414b; --focus:#8ab4f8;
  --good:#6fd49a; --good-soft:#143a28; --warn:#f0c15a; --warn-soft:#41330f; --bad:#ff8f86; --bad-soft:#4a1d1a;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c7:#9085e9;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d171d; --surface:#15232b; --surface-2:#1d2f39; --ink:#e9f0f4; --muted:#a8bac6; --line:#2a3f4b;
  --accent:#5cc4d6; --accent-ink:#06222a; --accent-soft:#17414b; --focus:#8ab4f8;
  --good:#6fd49a; --good-soft:#143a28; --warn:#f0c15a; --warn-soft:#41330f; --bad:#ff8f86; --bad-soft:#4a1d1a;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c7:#9085e9;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 18px/1.55 var(--font-body);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--font-display);font-weight:700;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.7rem,4.5vw,2.3rem)} h2{font-size:1.4rem} h3{font-size:1.1rem}
p{margin:0}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-direction:column;gap:6px;padding-block:10px 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand b{font:700 1.15rem var(--font-display)}
.brand span{color:var(--muted);font-size:.9rem}

.tabs::-webkit-scrollbar{display:none}
.tabs a{white-space:nowrap;text-decoration:none;color:var(--muted);font-weight:700;padding:10px 14px;border-bottom:4px solid transparent}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.subbar{background:var(--surface-2);border-bottom:1px solid var(--line)}
.subbar .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:8px}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}

input[type=range]{width:100%;accent-color:var(--accent);height:34px}

table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.95rem}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}

.seg.modes{display:flex;flex-wrap:wrap;border-radius:16px;width:fit-content;max-width:100%}
.seg.modes button{text-align:left}
@media (max-width:640px){.seg.modes{flex-direction:column;width:100%}}
.inset{background:var(--bg);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:16px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px}

.answer.good .mark{background:var(--good)} .answer.warn .mark{background:var(--warn)} .answer.bad .mark{background:var(--bad)}
:root[data-theme="dark"] .answer .mark{color:#06160e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .answer .mark{color:#06160e}}
.lines{display:flex;flex-direction:column;gap:10px}
.line{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;padding:12px 14px;border-radius:10px;background:var(--bg)}
.line .t{font-weight:700}
ul.opts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
ul.opts li{background:var(--bg);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.btn.small{padding:8px 14px;font-size:.95rem;width:fit-content}
details.gloss{border-top:1px solid var(--line);padding:10px 0}

@media (pointer:coarse){button,.seg button,.btn{min-height:48px} input[type=range]{height:44px} .inp input,.field>input{padding:13px 12px}}
/* phones and other small touch screens only (touch as the main input): thumb-friendly bottom tab bar, cards instead of wide tables.
   A narrow desktop window keeps the full layout. */
@media (max-width:640px) and (pointer:coarse){
  body{font-size:17px}
  .bar .wrap{padding-block:8px 6px}
  .brand span{display:none}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin:0;padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);background:var(--surface);border-top:1px solid var(--line);overflow:visible}
  .tabs a{display:flex;align-items:center;justify-content:center;min-height:58px;padding:8px 2px;text-align:center;font-size:.8rem;line-height:1.15;white-space:normal;border-bottom:0;border-top:4px solid transparent}
  .tabs a[aria-current="page"]{border-top-color:var(--accent);color:var(--ink)}
  main{padding-block:16px 16px}
  .foot{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  #viewLabel{display:none}
  .subbar .wrap{padding-block:6px;gap:8px}
  .seg button{padding:8px 12px}
  .card{padding:16px}
  .kpi .v{font-size:1.6rem}
  .tablewrap{overflow:visible}
  table.cards,table.cards tbody,table.cards tr,table.cards td{display:block;width:100%}

  table.cards tr{border:1px solid var(--line);border-radius:12px;padding:4px 12px;margin-bottom:12px;background:var(--bg)}

  table.cards td:first-child::before{content:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
/*ENGINE_START*/
const END_AGE = 70;           // the plan runs at least until Person 1 reaches this age
const COVER_AFTER_SPA = 36;   // ...and at least this many months after the later State Pension starts
const PA_BASE = 12570;        // personal allowance
const TAX_RATE = 0.20;        // basic rate only
const HR_THRESHOLD = 50270;  // Marriage Allowance only helps a basic-rate taxpayer
const PA_FREEZE_END = 2031*12 + 3; // allowance frozen until April 2031 (month index)
const NI_RATE = 0.08;         // employee National Insurance on earnings above the threshold (stops at State Pension age)
const NI_THRESHOLD = 12570;
// "Safe to retire" test: an emergency fund that is never touched, plus a safety margin on three things that often go wrong.
const RESERVE_MONTHS = 6;     // emergency fund, in months of essential spending
const SPEND_MARGIN = 0.05;    // spending 5% higher than planned
const STRESS_LAG = 1;         // first pension payments a month late
const STRESS_INFLATION = 2.5; // prices up 2.5% a year (the tax-free allowance is frozen to 2031)

function monthIdx(str){ const [y,m] = str.split('-').map(Number); return y*12 + (m-1); }
function todayStr(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function minusYears(str, n){ const [y,m,d] = str.split('-'); return (Number(y)-n)+'-'+m+'-'+d; }

// State Pension age in months, England/Wales/NI rules for people born from 1954.
// Born up to 5 Apr 1960: 66. 6 Apr 1960 to 5 Mar 1961: 66 plus 1-11 months. 6 Mar 1961 to 5 Apr 1977: 67. After: 68.
function spaMonths(str){
  const [y,m,d] = str.split('-').map(Number);
  const v = y*10000 + m*100 + d;
  if (v <= 19600405) return 66*12;
  if (v <= 19610305){ const mo = (y-1960)*12 + (m-4) - (d < 6 ? 1 : 0); return 66*12 + Math.min(11, mo+1); }
  if (v <= 19770405) return 67*12;
  return 68*12;
}

function defaultState(){
  return {
    names:['Person 1','Person 2'],
    dob:[minusYears(todayStr(),60), minusYears(todayStr(),60)], dobConfirmed:false,
    pension:[15000,0], pensionAge:[60,57], sp:[12547.60,12547.60],
    ess:1500, ideal:2000,
    cash:20000, lump:20000, emergency:2000, swr:4, invest:true, drawdown:true,
    inflation:0, cashReal:0, growth:3, marriage:false, payLag:0,
    extra2:0, work:[0,0], view:'e', tourSeen:false
  };
}

function simulate(s, o){
  o = o || {};
  const nowIdx = o.nowIdx != null ? o.nowIdx : monthIdx(todayStr());
  const dobIdx = s.dob.map(monthIdx);
  const retire = dobIdx[0] + s.pensionAge[0]*12;
  const start = Math.max(retire, nowIdx);
  const spaIdx = s.dob.map((d,i) => dobIdx[i] + spaMonths(d));
  const N = Math.max(12, dobIdx[0] + END_AGE*12 - start, Math.max(spaIdx[0], spaIdx[1]) + COVER_AFTER_SPA - start);
  const penStart = [retire, dobIdx[1] + s.pensionAge[1]*12];
  const pen = [s.pension[0], s.pension[1] + (o.extra2 != null ? o.extra2 : (s.extra2 || 0))];
  const isaAmt = s.invest ? Math.max(0, s.lump - s.emergency) : 0;
  const isaBase = o.legacyIsa ? isaAmt + s.emergency : isaAmt;
  const isaYear = (s.invest && s.drawdown) ? isaBase * s.swr/100 : 0;   // yearly income taken from the investment
  const buf0 = s.cash + (s.invest ? Math.min(s.emergency, s.lump) : s.lump);
  const rc = Math.pow(1 + s.cashReal/100, 1/12) - 1;
  const lag = Math.max(0, Math.round(s.payLag || 0));   // months before the first pension payments arrive (paid in arrears)
  // The investment: grows each year (above inflation, in today's money) and pays the income above, if any.
  // The income stops if the pot is used up.
  const Y = Math.ceil(N/12);
  const isaModel = s.invest ? lumpModel(isaAmt, isaYear, s.growth/100, Y, null) : {pot:new Array(Y+1).fill(0), taken:new Array(Y+1).fill(0)};
  const frozenYears = Math.max(0, (PA_FREEZE_END - nowIdx)/12);
  const buf = {e:buf0, i:buf0};
  const months = [];
  for (let m=0; m<N; m++){
    const idx = start + m;
    const t = Math.min(Math.max((idx-nowIdx)/12, 0), frozenYears);
    const PA = PA_BASE / Math.pow(1 + s.inflation/100, t);
    const p = [0,0], q = [0,0];
    for (let i=0; i<2; i++){
      p[i] = idx >= penStart[i] + lag ? pen[i] : 0;
      q[i] = idx >= spaIdx[i] + lag ? s.sp[i] : 0;
    }
    // part-time earnings, from the start of the plan until each person's own State Pension age
    const w = [0,1].map(i => (idx < spaIdx[i] ? ((s.work || [0,0])[i] || 0) : 0));
    const ni = w.map(x => Math.max(0, x - NI_THRESHOLD) * NI_RATE);
    const gross = [p[0]+q[0]+w[0], p[1]+q[1]+w[1]];
    let tax = gross.map(x => Math.max(0, x - PA) * TAX_RATE);
    let mSave = 0;
    if (s.marriage){
      // Marriage Allowance: a non-taxpayer gives up 10% of the allowance (rounded up to £10);
      // a basic-rate taxpayer partner gets a tax reduction of that amount at 20%.
      // The giver's allowance falls, so they can start to pay tax. Only claimed if it saves money overall.
      const T = Math.ceil(PA*0.1/10)*10;
      for (const [d,r] of [[0,1],[1,0]]){
        if (gross[d] <= PA && gross[r] > PA && gross[r] <= HR_THRESHOLD){
          const alt = [0,0];
          alt[d] = Math.max(0, gross[d] - (PA - T)) * TAX_RATE;
          alt[r] = Math.max(0, tax[r] - T*TAX_RATE);
          const save = (tax[0]+tax[1]) - (alt[0]+alt[1]);
          if (save > 0){ tax = alt; mSave = save; }
          break;
        }
      }
    }
    for (let i=0; i<2; i++){
      const k = gross[i] > 0 ? 1 - tax[i]/gross[i] : 1;
      p[i] *= k; q[i] *= k; w[i] *= k;      // spendable part of each source, tax shared pro rata
    }
    const yr = Math.floor(m/12), isa = isaModel.taken[yr+1] - isaModel.taken[yr];
    const income = (p[0]+p[1]+q[0]+q[1]+w[0]+w[1]-ni[0]-ni[1]+isa)/12;
    const rec = {idx, p, q, w, ni, tax, isa, income, PA, mSave};
    for (const sc of ['e','i']){
      const bud = sc==='e' ? s.ess : s.ideal;
      if (buf[sc] > 0) buf[sc] *= (1 + rc);
      buf[sc] += income - bud;
      rec[sc] = buf[sc];
    }
    months.push(rec);
  }
  // yearly rows
  const rows = [];
  for (let a=0; a<N; a+=12){
    const b = Math.min(N, a+12), n = b-a;
    const src = {p0:0,q0:0,p1:0,q1:0,w:0,isa:0}; let tax = 0, ni = 0, income = 0, mSave = 0;
    for (let m=a; m<b; m++){
      const r = months[m];
      src.p0 += r.p[0]/12/n; src.q0 += r.q[0]/12/n; src.p1 += r.p[1]/12/n; src.q1 += r.q[1]/12/n; src.isa += r.isa/12/n; src.w += (r.w[0]+r.w[1]-r.ni[0]-r.ni[1])/12/n;
      tax += (r.tax[0]+r.tax[1])/12; ni += (r.ni[0]+r.ni[1])/12; income += r.income; mSave += r.mSave/12;
    }
    const prev = a===0 ? {e:buf0, i:buf0} : months[a-1];
    const ageM = (st) => (start + st - dobIdx[0]);
    rows.push({a, n, src, tax, ni, mSave, income, avg:income/n, isaStart:isaModel.pot[a/12], isaEnd:isaModel.pot[a/12+1],
      age0:Math.floor(ageM(a)/12), age1:ageM(b)/12,
      page0:Math.floor((start + a - dobIdx[1])/12),
      startBuf:{e:prev.e, i:prev.i}, endBuf:{e:months[b-1].e, i:months[b-1].i},
      budget:{e:s.ess*n, i:s.ideal*n}});
  }
  const spaM = spaIdx.map(x => x - start);
  const marriageTotal = months.reduce((t,r) => t + r.mSave/12, 0);
  return {start, marriageTotal, endAge:(start + N - dobIdx[0])/12, isaPot:isaModel.pot, isaStart:isaAmt, N, months, rows, dobIdx, spaIdx, spaM, retire, buf0, isaAmt, isaYear,
          spaAge: s.dob.map(spaMonths)};
}

function summarise(sim, sc){
  const key = sc;
  let min = Infinity, minM = 0, runOut = -1;
  sim.months.forEach((r,m) => { if (r[key] < min){ min = r[key]; minM = m; } if (runOut<0 && r[key] < 0) runOut = m; });
  const minMonths = min;
  let minLater = Infinity;                       // lowest balance from the end of the first year onwards
  sim.months.forEach((r,m) => { if (m >= 11 && r[key] < minLater) minLater = r[key]; });
  min = Math.min(min, sim.buf0);
  const lastSpa = Math.min(sim.N-1, Math.max(0, Math.max(sim.spaM[0], sim.spaM[1])));
  const firstSpa = Math.min(sim.N-1, Math.max(0, Math.min(sim.spaM[0], sim.spaM[1])));
  return {min, minMonths, minLater, minM, runOut, end:sim.months[sim.N-1][key], atSpa:sim.months[lastSpa][key],
          lastSpa, firstSpa, incomeBefore:sim.months[0].income, incomeAfter:sim.months[sim.N-1].income,
          incomeBeforeLastSpa: sim.months[Math.max(0, lastSpa-1)].income};
}

// Smallest extra yearly pension for Person 2 that keeps the savings from ever going below `floor` (default zero).
function neededExtra(s, sc, floor){
  floor = floor || 0;
  const f = x => summarise(simulate(s, {extra2:x}), sc).min;
  if (f(0) >= floor) return 0;
  let lo = 0, hi = 40000;
  if (f(hi) < floor) return null;
  for (let k=0; k<40; k++){ const mid = (lo+hi)/2; if (f(mid) >= floor) hi = mid; else lo = mid; }
  return Math.ceil(hi/10)*10;
}

// Traffic light for one budget. 'bad' = savings run out (inside the plan, or soon after it ends because
// income stays below spending). 'warn' = never below zero but under 3 months of spending, or runs out late.
function assess(sim, sc, budget){
  const s = summarise(sim, sc);
  const endFlow = sim.months[sim.N-1].income - budget;
  let cls = 'good', code = 'covered', lastsToM = null;
  if (s.runOut >= 0){ cls = 'bad'; code = 'runs-out'; }
  else {
    if (endFlow < -0.5){ lastsToM = sim.N + s.end/(-endFlow); }
    const lastsToAge = lastsToM == null ? Infinity : (sim.start + lastsToM - sim.dobIdx[0])/12;
    if (lastsToAge < 85){ cls = 'bad'; code = 'long-run'; }
    else if (lastsToAge < 95){ cls = 'warn'; code = 'long-run'; }
    else if (s.min < budget*3){ cls = 'warn'; code = 'tight'; }
  }
  return Object.assign(s, {cls, code, endFlow, lastsToM});
}

// The plan with a safety margin: spending 5% higher, first payments a month late, prices rising 2.5% a year.
function stressedState(s){
  return Object.assign({}, s, {payLag:Math.max(s.payLag||0, STRESS_LAG), inflation:Math.max(s.inflation, STRESS_INFLATION),
    ess:s.ess*(1+SPEND_MARGIN), ideal:s.ideal*(1+SPEND_MARGIN)});
}
// Safe = under the safety margin the savings never run out, the emergency fund is in place by the end of the first
// year and never touched after that, and income after the State Pensions covers spending. Tight = works as entered but fails the safety margin. No = runs out as entered.
function readiness(s, sc, o){
  const st = stressedState(s), reserve = RESERVE_MONTHS * s.ess;
  const stressed = assess(simulate(st, o), sc, sc==='e' ? st.ess : st.ideal);
  const base = assess(simulate(s, o), sc, sc==='e' ? s.ess : s.ideal);
  const safe = stressed.runOut < 0 && stressed.code !== 'long-run' && stressed.minLater >= reserve;
  const level = safe ? 'safe' : (base.runOut < 0 && base.cls !== 'bad' ? 'tight' : 'no');
  return {level, safe, base, stressed, reserve, gap:Math.max(0, reserve - stressed.minLater)};
}
// Extra yearly earnings (before tax and National Insurance) one person would need, until their own
// State Pension age, to make the plan safe. 0 = already safe. null = more than 60,000 would not be enough.
function neededWork(s, person, sc, o){
  const base = (s.work || [0,0]).slice();
  const ok = x => { const w = base.slice(); w[person] = base[person] + x; return readiness(Object.assign({}, s, {work:w}), sc, o).safe; };
  if (ok(0)) return 0;
  let lo = 0, hi = 60000;
  if (!ok(hi)) return null;
  for (let k=0; k<40; k++){ const mid = (lo+hi)/2; if (ok(mid)) hi = mid; else lo = mid; }
  return Math.ceil(hi/10)*10;
}

// Lump sum: the same yearly withdrawal from the same pot, cash versus invested (today's money).
function lumpModel(amount, withdrawal, rate, years, firstYearRate){
  const pot = [amount], taken = [0]; let p = amount, t = 0;
  for (let y=1; y<=years; y++){
    const r = (y===1 && firstYearRate != null) ? firstYearRate : rate;
    p = p*(1+r);
    const w = Math.min(p, withdrawal); p -= w; t += w;
    pot.push(p); taken.push(t);
  }
  return {pot, taken};
}

function niceScale(min, max, n){
  n = n || 5; if (max === min) max = min + 1;
  const raw = (max-min)/n, mag = Math.pow(10, Math.floor(Math.log10(raw))), nr = raw/mag;
  const step = (nr<1.5?1:nr<3?2:nr<7?5:10)*mag;
  const lo = Math.floor(min/step)*step, hi = Math.ceil(max/step)*step, ticks = [];
  for (let v=lo; v<=hi+step/2; v+=step) ticks.push(Math.round(v*1e6)/1e6);
  return {lo, hi, ticks};
}

    s.pts.forEach(p => { if (s.hover !== false) g += `<circle cx="${x(p[0])}" cy="${y(p[1])}" r="9" fill="transparent" data-tip="${esc(s.name)}, age ${+p[0].toFixed(0)}: ${money(p[1])}"/>`; });
  });
  (o.markers||[]).forEach(mk => { g += `<circle cx="${x(mk.x)}" cy="${y(mk.y)}" r="6" fill="${mk.color}" stroke="var(--surface)" stroke-width="2"/><text class="axb" x="${x(mk.x)}" y="${y(mk.y)-12}" text-anchor="middle">${esc(mk.label)}</text>`; });
  el.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Line chart')}">${g}</svg>`
    + `<div class="legend" style="margin-top:10px">${o.series.filter(s=>!s.noLegend).map(s => `<span><i class="ln ${s.dash?'dash':''}" style="border-color:${s.color}"></i>${esc(s.name)}</span>`).join('')}${o.band?`<span><i style="background:${o.band.color};opacity:.3"></i>${esc(o.band.label)}</span>`:''}</div>`;
}

/* ---------- verdicts ---------- */
function verdict(sim, sc, st){
  const bud = budgetOf(sc, st), s = assess(sim, sc, bud);
  const ageAt = mo => ageText(sim.start + mo - sim.dobIdx[0]);
  const lowAge = ageAt(s.minM+1), end = endLbl(sim);
  if (s.code === 'runs-out'){
    const rec = s.end >= 0 ? `By age ${end} you would be back in credit.` : `At age ${end} you would still be ${money(-s.end)} short.`;
    return {cls:'bad', icon:'✕', pill:'Money runs out', text:`Your savings run out at age ${ageAt(s.runOut+1)}. At the worst point you would be ${money(-s.min)} short (age ${lowAge}). ${rec}`, s};
  }
  if (s.code === 'long-run'){
    const to = ageText(sim.start + s.lastsToM - sim.dobIdx[0]);
    return {cls:s.cls, icon:s.cls==='bad'?'✕':'!', pill:s.cls==='bad'?'Runs out later':'Does not last for life', text:`You get through to age ${end}. After that, the money coming in is ${money(-s.endFlow)} a month less than you spend, so your savings would run out around age ${to}.`, s};
  }
  if (s.code === 'tight'){
    return {cls:'warn', icon:'!', pill:'Only just enough', text:`You would just manage, but at the worst point only ${money(s.min)} is left. That is less than 3 months of spending, so one big bill could cause trouble.`, s};
  }
  return {cls:'good', icon:'✓', pill:'Enough', text:`Your savings never run out. At the worst point you still have ${money(s.min)} (age ${lowAge}).`, s};
}
const pillHTML = v => `<span class="pill ${v.cls}"><span aria-hidden="true">${v.icon}</span>${v.pill}</span>`;
function spaLine(sim){
  return [0,1].map(i => `${nmx(i)} can claim State Pension from age <b>${ageText(sim.spaAge[i])}</b> (${monthName(sim.spaIdx[i])})`).join('. ') + '.';
}
const dobBanner = () => S.dobConfirmed ? '' : `<div class="note"><b>Please enter your real dates of birth.</b> This app has used example dates for now (both people 60 today). The age you can claim State Pension depends on your date of birth, and it changes the answer a lot. <a href="#numbers">Go to Your numbers</a>.</div>`;

/* ---------- "can you afford to retire?" ---------- */
const netGain = (person, extra) => { const w = (S.work||[0,0]).slice(); w[person] += extra; return simulate({...S, work:w}).months[0].income - simulate(S).months[0].income; };
function rowFor(sc, r){
  const bud = budgetOf(sc), name = sc==='e' ? `Essentials only · ${money(S.ess)} a month` : `Your ideal lifestyle · ${money(S.ideal)} a month`;
  let cls, icon, pill, text;
  if (r.level === 'safe'){
    cls='good'; icon='✓'; pill='Safe';
    text = `Still works with the safety margin. Your savings stay above ${money(r.stressed.minLater)}, which is more than your ${money(r.reserve)} emergency fund.`;
  } else if (r.level === 'tight'){
    cls='warn'; icon='!'; pill='Close, but not safe yet';
    const st = r.stressed;
    const why = st.runOut >= 0 ? `But if bills run 5% higher and payments come a month late, your savings would run out.`
      : st.code === 'long-run' ? `But after your State Pensions start, the money coming in is below what you spend, so it would not last for life.`
      : `With the safety margin your savings fall to ${money(st.minLater)}, which is ${money(r.gap)} below your ${money(r.reserve)} emergency fund.`;
    text = `It works if everything goes to plan (lowest point ${money(r.base.min)}). ${why}`;
  } else {
    cls='bad'; icon='✕'; pill='Not yet';
    text = verdict(simulate(S), sc).text;
  }
  return `<div class="line"><div class="t">${name}</div>${pillHTML({cls, icon, pill})}<div>${text}</div></div>`;
}
function optionsFor(sc, r){
  const label = sc==='e' ? 'to be safe on essentials' : 'to be safe on your ideal lifestyle';
  const items = [];
  for (const p of [0,1]){
    const x = neededWork(S, p, sc);
    if (x === null || x === 0) continue;
    items.push(`<li><div><b>${nmx(p)}</b> earns an extra <b>${money(x)} a year</b> before tax (about <b>${money(netGain(p, x))} a month</b> after tax) until their State Pension starts.</div><button type="button" class="btn ghost small" data-try="${p},${x}">Try this in my plan</button></li>`);
  }
  if (!items.length) return `<h3>Extra income ${label}</h3><p>Extra income on its own would not be enough. You would also need to spend less, or wait longer to retire.</p>`;
  return `<h3>Extra income ${label}</h3><ul class="opts">${items.join('')}</ul>`;
}
function answerHTML(){
  const rE = readiness(S,'e'), rI = readiness(S,'i'), sim0 = simulate(S), startAge = Math.floor((sim0.start - sim0.dobIdx[0])/12);
  let cls, mark, head, lead;
  if (rI.safe){ cls='good'; mark='✓'; head='Yes, you can afford to retire.';
    lead = `Even on your ideal lifestyle of ${money(S.ideal)} a month, your money lasts, with a safety margin and an emergency fund of ${money(rI.reserve)} kept untouched.`; }
  else if (rE.safe){ cls='good'; mark='✓'; head='Yes, you can afford to retire on essentials.';
    lead = `Your essential spending of ${money(S.ess)} a month is covered, with a safety margin and an emergency fund of ${money(rE.reserve)} kept untouched. Your ideal lifestyle of ${money(S.ideal)} a month is not safe yet.`; }
  else if (rE.level === 'tight'){ cls='warn'; mark='!'; head='You are close, but not safe yet.';
    lead = `On paper your essential spending is covered. But there is not enough room if bills go up or payments are late, so this app cannot call it safe.`; }
  else { cls='bad'; mark='✕'; head='Not yet. Your money would run short.';
    lead = `Retiring at age ${startAge} on essential spending of ${money(S.ess)} a month would leave you short. Here is what would change that.`; }
  const targets = [['e', rE], ['i', rI]].filter(([k, r]) => !r.safe);
  const work = (S.work||[0,0]).map((x,i) => x > 0 ? `${nmx(i)} ${money(x)} a year` : null).filter(Boolean);
  return `<section class="card answer ${cls}" aria-live="polite">
      <div class="big"><span class="mark" aria-hidden="true">${mark}</span><div><h1>${head}</h1><p class="lead" style="margin-top:6px">${lead}</p></div></div>
      <div class="lines">${rowFor('e', rE)}${rowFor('i', rI)}</div>
      ${work.length ? `<div class="info">This plan already includes extra earnings: ${work.join(' and ')}, until State Pension starts. <button type="button" class="btn ghost small" data-clearwork="1">Remove them</button></div>` : ''}
      ${targets.length ? `<div><h2>You could safely retire if…</h2><p class="small" style="margin:6px 0 10px">Extra income can come from part-time work, a private pension or anything else that is taxed as income. It stops when that person's State Pension starts.</p>${targets.map(([k, r]) => optionsFor(k, r)).join('')}</div>` : ''}
      <details class="how"><summary>How this app decides if it is safe</summary>
        <ul class="tidy" style="margin-top:10px">
          <li>This app keeps an <b>emergency fund</b> of 6 months of essential spending (${money(rE.reserve)}). Your savings must never go below it.</li>
          <li>This app adds a <b>safety margin</b>. It checks the plan again with your spending 5% higher, your first pension payments a month late, and prices rising 2.5% a year.</li>
          <li>Your money coming in after the State Pensions start must also cover what you spend. Otherwise the savings would run out later.</li>
          <li>If the plan passes all of that, it is called <b>safe</b>. This is a careful guide, not a promise, and it cannot see future surprises such as big repairs or care costs.</li>
          <li>For free, impartial help, contact MoneyHelper or Pension Wise (both government-backed) before you decide.</li></ul></details>
    </section>`;
}
const GLOSSARY = [
  ['State Pension', 'Money from the government once you reach State Pension age. It does not start by itself: you must claim it, up to 4 months before. Check your forecast at gov.uk/check-state-pension.'],
  ['Tax-free allowance', 'The amount you can receive each year without paying income tax. It is £12,570 and is frozen until April 2031. Income above it is taxed at 20p in every £1 (the basic rate), up to £50,270.'],
  ['Marriage Allowance', 'If one of you pays no tax and the other pays the basic 20% rate, the one who pays no tax can pass £1,260 of their allowance to the other. That saves up to £252 a year. You have to claim it from HMRC.'],
  ['Lump sum', 'A one-off, tax-free payment from a workplace pension when you start taking it.'],
  ['Investment (Stocks & Shares ISA)', 'Money put into shares and funds instead of the bank. Growth and income are tax-free in an ISA. It can go down as well as up.'],
  ['Emergency fund', 'Money kept aside for surprises, such as a broken boiler or car repair. This app keeps 6 months of essential spending untouched.'],
  ['Safety margin', 'This app tests your plan with spending 5% higher, first pension payments a month late, and prices rising 2.5% a year. If it still works, the plan is called safe.'],
  ['Today\'s money', 'Every amount is shown as what it would buy today. That way there is no need to guess future prices.'],
  ['National Insurance', 'A payment on earnings from work (8% on earnings above £12,570 a year). You stop paying it when you reach State Pension age. It is not charged on pensions.']
];
const glossaryHTML = () => GLOSSARY.map(g => `<details class="gloss"><summary>${g[0]}</summary><p>${g[1]}</p></details>`).join('');
function cardify(t){
  const heads = [...t.querySelectorAll('thead th')].map(th => th.textContent.trim());
  t.classList.add('cards');
  t.querySelectorAll('tbody tr').forEach(tr => [...tr.children].forEach((td, i) => td.setAttribute('data-label', heads[i] || '')));
}

        <div class="sliderrow"><div class="top"><label for="split"><b style="font-size:1.1rem">How much goes into the investment?</b></label><b id="splitV"></b></div><input type="range" id="split" min="0" max="18000" step="50"></div>
        <div class="two">
          <div class="field"><label for="amtCash">Into your savings</label><div class="inp"><span>£</span><input id="amtCash" type="number" inputmode="decimal" min="0" step="any"></div></div>
          <div class="field"><label for="amtInv">Into the investment</label><div class="inp"><span>£</span><input id="amtInv" type="number" inputmode="decimal" min="0" step="any"></div></div>
        </div>
        <div class="sliderrow" id="swrBox"><div class="top"><label for="swr"><b style="font-size:1.1rem">Yearly income taken from the investment</b></label><b id="swrV"></b></div><input type="range" id="swr" min="1" max="8" step="0.25"><span class="small" id="swrNote"></span></div>
      </div></section>
    <section class="card" id="growCard"><h2 id="gH"></h2><div id="gChart"></div><p class="small" id="gNote"></p><div class="tablewrap" id="gTbl"></div></section>
    <section class="card"><h2 id="lH"></h2><div id="lChart"></div><p class="small" id="lNote"></p><div id="barsWrap"><h3 id="bH"></h3><div id="bars"></div></div></section>
    <section class="card"><h2>Try different assumptions</h2>
      <div class="sliderrow"><div class="top"><label for="gr"><b style="font-size:1.1rem">Growth of the investment each year, after prices rise</b></label><b id="grv"></b></div><input type="range" id="gr" min="0" max="6" step="0.5"></div>
      <div class="sliderrow"><div class="top"><label for="cr"><b style="font-size:1.1rem">Interest on your savings, after prices rise</b></label><b id="crv"></b></div><input type="range" id="cr" min="-2" max="3" step="0.5"></div>
      <label class="check"><input type="checkbox" id="stress"> Bad start: markets fall 25% in the first year (charts on this page only)</label>
      <p class="small">Savings in the bank usually earn about the same as prices rise, so they stay the same in real terms. Shares and funds have grown faster over long periods, but with bad years along the way. The shaded band on the long chart shows 3 points lower to 2 points higher.</p>
    </section>
    <section class="card"><h2>All three choices side by side</h2><div id="cmp"></div></section>`; },
  update(){
    const mode = modeOf(S), sim = simulate(S), sc = S.view;
    const lump = Math.max(0, S.lump), cashIn = Math.min(Math.max(0, S.emergency), lump), amt = lump - cashIn;
    const income = mode === 'income', wdPlan = income ? amt*S.swr/100 : 0;
    const startAge = (sim.start - sim.dobIdx[0])/12, g = S.growth/100, rc = S.cashReal/100;
    const crash = $('#stress') && $('#stress').checked ? -0.25 : null;
    $('#modeTxt').textContent = {cash:`All ${money(lump)} goes into your savings. Nothing is invested.`,
      grow:`${money(cashIn)} goes into your savings and ${money(amt)} is invested. You take nothing out, so the investment just grows.`,
      income:`${money(cashIn)} goes into your savings and ${money(amt)} is invested. Each year you take ${S.swr}% of it (${money(amt*S.swr/100)}) as extra income.`}[mode];
    $('#splitBox').hidden = mode === 'cash'; $('#swrBox').hidden = !income;
    $('#split').max = lump; setVal($('#split'), amt); $('#splitV').textContent = money(amt) + ' invested';
    setVal($('#amtCash'), cashIn); setVal($('#amtInv'), amt);
    setVal($('#swr'), S.swr); $('#swrV').textContent = S.swr + '%'; $('#swrNote').textContent = `${money(amt*S.swr/100)} a year, ${money(amt*S.swr/1200, true)} a month, tax-free from an ISA.`;
    setVal($('#gr'), S.growth); $('#grv').textContent = S.growth + '%'; setVal($('#cr'), S.cashReal); $('#crv').textContent = S.cashReal + '%';
    const end = endLbl(sim);

    /* --- how the investment grows during the plan --- */
    if (mode === 'cash' || amt <= 0){
      $('#gH').textContent = mode === 'cash' ? 'No investment in this choice' : 'Nothing is going into the investment';
      $('#gChart').innerHTML = `<p class="lead">${mode === 'cash' ? 'Choose a split above to see how an investment would grow during your plan.' : 'The savings pot amount is the whole lump sum. Lower it, or raise the lump sum on Your numbers.'}</p>`;
      $('#gNote').textContent = ''; $('#gTbl').innerHTML = '';
    } else {
      const years = sim.rows.length, inv = lumpModel(amt, wdPlan, g, years, crash);
      const ptsInv = inv.pot.map((v,y) => [y===0 ? startAge : sim.rows[y-1].age1, v]);
      const ptsPot = [[startAge, sim.buf0]].concat(sim.rows.map(r => [r.age1, r.endBuf[sc]]));
      const ptsAll = ptsInv.map((p,i) => [p[0], p[1] + ptsPot[i][1]]);
      const last = inv.pot[years], taken = inv.taken[years];
      $('#gH').textContent = `Your ${money(amt)} investment grows to ${money(last)} by age ${end}${income ? `, after paying you ${money(taken)}` : ''}.`;
      lineChart($('#gChart'), {series:[
        {name:'Investment', color:'var(--c1)', pts:ptsInv, short:'Investment'},
        {name:'Your savings', color:'var(--c3)', pts:ptsPot, short:'Savings'},
        {name:'Both together', color:'var(--ink)', pts:ptsAll, dash:'6 5', width:2.5, short:'Together'}],
        xMin:Math.floor(startAge), xMax:Math.ceil(sim.endAge), xStep:1, zero:true, endLabels:true, xTitle:`${nm(0)}'s age`, label:'Value of the investment, your savings and the two together over the plan'});
      $('#gNote').textContent = `Your savings are shown for ${sc==='e'?'essentials only':'your ideal lifestyle'}. Together, your savings and the investment are worth ${money(last + sim.rows[years-1].endBuf[sc])} at age ${end}. This app assumes the investment grows ${S.growth}% a year after prices rise, so these amounts are in today's money.${crash ? ' This includes a 25% fall in the first year.' : ''}`;
      $('#gTbl').innerHTML = `<table><thead><tr><th>Year</th><th>${esc(nm(0))} age</th><th>Investment at start</th><th>Growth</th>${income?'<th>Paid to you</th>':''}<th>Investment at end</th><th>Your savings</th><th>Savings + investment</th></tr></thead><tbody>`
        + sim.rows.map((r,y) => { const st = inv.pot[y], en = inv.pot[y+1], tk = inv.taken[y+1] - inv.taken[y], pot = r.endBuf[sc];
          return `<tr><td>Year ${y+1}</td><td>${r.age0}</td><td>${money(st)}</td><td class="pos">+${money(en - st + tk)}</td>${income?`<td>${money(tk)}</td>`:''}<td><b>${money(en)}</b></td><td class="${pot<0?'neg':''}">${money(pot)}</td><td class="${en+pot<0?'neg':''}">${money(en + pot)}</td></tr>`; }).join('') + `</tbody></table>`;
    }

    /* --- long view to age 90: invested versus cash --- */
    if (amt <= 0){
      $('#lH').textContent = 'Nothing to compare yet';
      $('#lChart').innerHTML = '<p class="lead">The lump sum is no bigger than the amount going into the savings pot. Lower that amount to compare investing with cash.</p>';
      $('#lNote').textContent = ''; $('#barsWrap').hidden = true; $('#cmp').innerHTML = ''; return;
    }
    const years = Math.max(10, Math.round(90 - startAge)), age = y => Math.round(startAge) + y, wd = income ? amt*S.swr/100 : 0;
    const inv = lumpModel(amt, wd, g, years, crash), lo = lumpModel(amt, wd, g-0.03, years, crash), hi = lumpModel(amt, wd, g+0.02, years, crash), cash = lumpModel(amt, wd, rc, years, null);
    const cashOut = cash.pot.findIndex(v => v <= 0.5);
    $('#lH').textContent = income
      ? (cashOut > 0 ? `As cash, the ${money(amt)} is gone by age ${age(cashOut)}. Invested, it is still ${money(inv.pot[years])} at age ${age(years)}.` : `Both versions last to age ${age(years)}, but invested leaves ${money(inv.pot[years]-cash.pot[years])} more.`)
      : `Invested, the ${money(amt)} grows to ${money(inv.pot[years])} by age ${age(years)}. As cash it would be ${money(cash.pot[years])}.`;
    const mk = m => m.pot.map((v,y) => [age(y), v]);
    lineChart($('#lChart'), {series:[
      {name:'Kept in savings', color:'var(--c2)', pts:mk(cash), short:'Cash'},
      {name:'Invested', color:'var(--c1)', pts:mk(inv), short:'Invested'}],
      band:{lo:mk(lo), hi:mk(hi), color:'var(--c1)', label:'Invested: range if markets do worse or better'},
      markers: income && cashOut > 0 ? [{x:age(cashOut), y:0, color:'var(--c2)', label:`Cash runs out, age ${age(cashOut)}`}] : [],
      xMin:age(0), xMax:age(years), xStep:5, zero:true, endLabels:true, xTitle:`${nm(0)}'s age`, label:'Value of the invested amount over time, cash versus invested', h:380});
    $('#lNote').textContent = income
      ? `Same ${money(wd)} taken out every year in both cases, in today's money. Invested assumes ${S.growth}% a year above inflation; cash assumes ${S.cashReal}%.${crash?' The invested line includes a 25% fall in year one.':''}`
      : `Nothing is taken out. Invested assumes ${S.growth}% a year above inflation; cash assumes ${S.cashReal}%.${crash?' The invested line includes a 25% fall in year one.':''}`;
    $('#barsWrap').hidden = !income;
    if (income){
      const rows = [['Kept in savings', cash.taken[years], cash.pot[years], 'var(--c2)'], ['Invested', inv.taken[years], inv.pot[years], 'var(--c1)']];
      const mx = Math.max(...rows.map(r => r[1]+r[2]), 1);
      $('#bH').textContent = `By age ${age(years)} investing gives ${money(rows[1][1]+rows[1][2]-rows[0][1]-rows[0][2])} more in total.`;
      $('#bars').innerHTML = rows.map(r => `<div style="display:grid;grid-template-columns:100px 1fr;gap:10px;align-items:center;margin-bottom:12px"><b>${r[0]}</b><div><div style="display:flex;height:34px;border-radius:6px;overflow:hidden;width:${(r[1]+r[2])/mx*100}%;min-width:4px"><div style="flex:${Math.max(r[1],0)};background:${r[3]};opacity:.55" data-tip="Taken as income: ${money(r[1])}"></div><div style="flex:${Math.max(r[2],0)};background:${r[3]}" data-tip="Still invested: ${money(r[2])}"></div></div><div class="small">${money(r[1])} taken as income${r[2]>0.5?` + ${money(r[2])} still there`:''}</div></div></div>`).join('')
        + `<div class="legend"><span><i style="background:var(--ink);opacity:.45"></i>Taken out as income</span><span><i style="background:var(--ink)"></i>Still in the pot</span></div>`;
    }

    /* --- all three choices through the whole plan --- */
    const opts = [['cash','Keep it all as cash',{invest:false}], ['grow','Split it, let the investment grow',{invest:true, drawdown:false}], ['income','Split it, take a yearly income',{invest:true, drawdown:true}]];
    $('#cmp').innerHTML = `<p class="lead">What each choice does to your plan, using the growth you chose above. The last two columns add the investment to your savings at age ${end}.</p><div class="tablewrap"><table><thead><tr><th></th><th>Lowest savings (essentials)</th><th>Lowest savings (ideal)</th><th>Investment at ${end}</th><th>Savings + investment (essentials)</th><th>Savings + investment (ideal)</th></tr></thead><tbody>`
      + opts.map(([k, lab, o]) => { const sm = simulate({...S, ...o}), e = summarise(sm,'e'), i = summarise(sm,'i'), iv = sm.isaPot[sm.isaPot.length-1];
        return `<tr style="${k===mode?'font-weight:700;background:var(--accent-soft)':''}"><td>${lab}${k===mode?' (your choice)':''}</td><td class="${e.min<0?'neg':''}">${money(e.min)}</td><td class="${i.min<0?'neg':''}">${money(i.min)}</td><td>${money(iv)}</td><td class="${e.end+iv<0?'neg':''}">${money(e.end+iv)}</td><td class="${i.end+iv<0?'neg':''}">${money(i.end+iv)}</td></tr>`; }).join('')
      + `</tbody></table></div>`;
  }
};

  {id:'pen1', title:() => `Does ${nm(1)} have a pension of their own?`, body:() => `
    <p>This could be a workplace or private pension. Leave it at £0 if there is none or you are not sure.</p>
    ${tnum('pension.1','Yearly pension, before tax','','£')}
    ${tnum('pensionAge.1','Pension can be taken from age','Most private pensions can be taken from 55 (57 from April 2028).')}`},
  {id:'sp0', title:() => `How much State Pension will ${nm(0)} get each year?`, body:() => `
    <p>The State Pension is paid by the government once you reach State Pension age.</p>
    ${tnum('sp.0','Yearly State Pension','','£')}
    <div class="chips">${chip('sp.0',12547.6,'Use the full amount (£12,547.60)')}</div>
    ${where('Get your forecast at gov.uk/check-state-pension. It is free and shows your yearly amount. The full amount is £12,547.60 a year in 2026/27. You get less if you have fewer than 35 years of National Insurance.')}`},
  {id:'sp1', title:() => `How much State Pension will ${nm(1)} get each year?`, body:() => `
    <p>Same question for ${nmx(1)}.</p>
    ${tnum('sp.1','Yearly State Pension','','£')}
    <div class="chips">${chip('sp.1',12547.6,'Use the full amount (£12,547.60)')}</div>
    ${where('Get the forecast at gov.uk/check-state-pension. Each person needs their own forecast.')}`},
  {id:'work', title:() => 'Will either of you work part-time after retiring?', body:() => `
    <p>This is optional. Enter what each of you would earn in a year before tax. It stops when that person's State Pension starts. Leave both at £0 if you will not work.</p>
    <div class="fields">${tnum('work.0',`${esc(nm(0))}: yearly earnings`,'','£')}${tnum('work.1',`${esc(nm(1))}: yearly earnings`,'','£')}</div>`},
  {id:'ess', title:() => 'What do you spend each month on the things you must pay for?', body:() => `
    <p>Think of bills and costs you cannot do without: housing, council tax, gas and electricity, water, food, transport, insurance, phone and internet, medicines.</p>
    ${tnum('ess','Essential spending, per month','','£')}
    ${where('Add up the last 3 months of your bank statements, leaving out holidays and treats, then divide by 3.')}`},
  {id:'ideal', title:() => 'What would you like to spend each month?', body:() => `
    <p>This is your ideal lifestyle: everything in your essentials, plus holidays, eating out, gifts, hobbies and treats.</p>
    ${tnum('ideal','Ideal spending, per month','','£')}`},
  {id:'cash', title:() => 'How much do you have in savings today?', body:() => `
    <p>Count money you could get at quickly, such as bank and building society accounts. Do not count money inside a pension.</p>
    ${tnum('cash','Savings today','','£')}`},
  {id:'lump', title:() => 'Will you get a tax-free lump sum when you retire?', body:() => `
    <p>Some workplace pensions pay a one-off, tax-free lump sum when you start taking them. It will be on your pension statement. Enter 0 if there is none.</p>
    ${tnum('lump','Tax-free lump sum','','£')}`},
  {id:'lumpmode', skip:() => S.lump <= 0, title:() => 'What should happen to the lump sum?', live:() => syncTourLump(), body:() => `
    <p>Choose the simplest one if you are unsure. You can change it any time on the Lump sum page.</p>
    ${modeSeg()}
    <p id="tourModeTxt" class="bigtext"></p>
    <ul class="tidy small"><li><b>Keep it all in savings:</b> simple and safe. It does not grow.</li><li><b>Split it, let the investment grow:</b> part stays in savings, part is invested for growth. Investments can go down as well as up.</li><li><b>Split it, take a yearly income:</b> as above, but you also take a small income from the investment each year.</li></ul>
    <div class="inset" id="splitBox">
      <div class="sliderrow"><div class="top"><label for="split"><b style="font-size:1.1rem">How much goes into the investment?</b></label><b id="splitV"></b></div><input type="range" id="split" min="0" max="18000" step="50"></div>
      <div class="two">
        <div class="field"><label for="amtCash">Into your savings</label><div class="inp"><span>£</span><input id="amtCash" type="number" inputmode="decimal" min="0" step="any"></div></div>
        <div class="field"><label for="amtInv">Into the investment</label><div class="inp"><span>£</span><input id="amtInv" type="number" inputmode="decimal" min="0" step="any"></div></div>
      </div>
      <div class="sliderrow" id="swrBox"><div class="top"><label for="swr"><b style="font-size:1.1rem">Yearly income from the investment</b></label><b id="swrV"></b></div><input type="range" id="swr" min="1" max="8" step="0.25"><span class="small" id="swrNote"></span></div>
    </div>`},
  {id:'marriage', title:() => 'Are you married or in a civil partnership?', live:() => document.querySelectorAll('[data-flagset]').forEach(b => { const [k, v] = b.dataset.flagset.split(','); b.setAttribute('aria-pressed', String(!!S[k] === (v === '1'))); }), body:() => `
    <p>If you are, one of you may be able to pass part of your tax-free allowance to the other and save tax. This is called Marriage Allowance. The app will include it if you say yes.</p>
    <div class="chips"><button type="button" class="choice" data-flagset="marriage,1" aria-pressed="false">Yes</button><button type="button" class="choice" data-flagset="marriage,0" aria-pressed="false">No</button></div>
    ${where('It only helps if one of you pays no tax and the other pays the basic 20% rate. You have to claim it from HMRC. The Your plan page shows how much it could save.')}`},
  {id:'done', next:'See my full plan', title:() => 'All done. Here is your answer.', body:() => `
    ${answerHTML()}
    <details class="how"><summary>Check what you entered</summary><ul class="tidy" style="margin-top:10px">
      <li>${nmx(0)} born ${esc(S.dob[0])}, retires at ${S.pensionAge[0]}, pension ${money(S.pension[0])} a year, State Pension ${money(S.sp[0])} a year.</li>
      <li>${nmx(1)} born ${esc(S.dob[1])}, pension ${money(S.pension[1])} a year from age ${S.pensionAge[1]}, State Pension ${money(S.sp[1])} a year.</li>
      <li>Spending: ${money(S.ess)} a month on essentials, ${money(S.ideal)} a month for your ideal lifestyle.</li>
      <li>Savings ${money(S.cash)}. Lump sum ${money(S.lump)}.${S.marriage ? ' Marriage Allowance is on.' : ''}</li></ul></details>
    <p class="small">You can change any number later on the Your numbers page, or take the tour again from the top of the page.</p>`}
];
function syncTourLump(){
  const mode = modeOf(S), lump = Math.max(0, S.lump), cashIn = Math.min(Math.max(0, S.emergency), lump), amt = lump - cashIn, income = mode === 'income';
  const t = $('#tourModeTxt'); if (!t) return;
  t.textContent = {cash:`All ${money(lump)} goes into your savings. Nothing is invested.`,
    grow:`${money(cashIn)} goes into your savings and ${money(amt)} is invested. You take nothing out, so the investment just grows.`,
    income:`${money(cashIn)} goes into your savings and ${money(amt)} is invested. Each year you take ${S.swr}% of it (${money(amt*S.swr/100)}) as extra income.`}[mode];
  $('#splitBox').hidden = mode === 'cash'; $('#swrBox').hidden = !income;
  $('#split').max = lump; setVal($('#split'), amt); $('#splitV').textContent = money(amt) + ' invested';
  setVal($('#amtCash'), cashIn); setVal($('#amtInv'), amt); setVal($('#swr'), S.swr); $('#swrV').textContent = S.swr + '%'; $('#swrNote').textContent = `${money(amt*S.swr/100)} a year, tax-free from an ISA.`;
}
const tourSteps = () => TOUR.filter(st => !st.skip || !st.skip());
function drawTour(){
  const steps = tourSteps(); tourStep = Math.max(0, Math.min(tourStep, steps.length - 1));
  const st = steps[tourStep], first = tourStep === 0, last = tourStep === steps.length - 1, pct = Math.round(tourStep / (steps.length - 1) * 100);
  $('#tourBox').innerHTML = `
    <div class="progress" role="progressbar" aria-label="Tour progress" aria-valuemin="1" aria-valuemax="${steps.length}" aria-valuenow="${tourStep+1}"><i style="width:${pct}%"></i></div>
    <p class="small" id="tourCount">Step ${tourStep+1} of ${steps.length}</p>
    <section class="card tourcard"><h1 id="tourH" tabindex="-1">${st.title()}</h1>${st.body()}</section>
    <div class="tournav">${first ? '' : '<button type="button" class="btn ghost big" data-tour="back">Back</button>'}<button type="button" class="btn big" data-tour="next">${st.next || 'Next'}</button></div>
    <p><button type="button" class="linkbtn" data-tour="skip">Skip the tour</button></p>`;
  bindCommon(); refresh();
  const h = $('#tourH'); if (h) h.focus({preventScroll:true});
  window.scrollTo(0, 0);
}
pages.tour = {
  build(){ return '<div id="tourBox"></div>'; },
  bind(){ drawTour(); },
  update(){
    document.querySelectorAll('#tourBox [data-key]').forEach(el => { if (document.activeElement !== el) el.value = getPath(el.dataset.key); });
    const st = tourSteps()[tourStep]; if (st && st.live) st.live();
    document.querySelectorAll('[data-name]').forEach(el => el.textContent = nm(+el.dataset.name));
  }
};
function tourFinish(){ S.tourSeen = true; save(); location.hash = '#plan'; }
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('[data-tour]');
  if (b){ const a = b.dataset.tour, n = tourSteps().length;
    if (a === 'back'){ tourStep = Math.max(0, tourStep - 1); drawTour(); }
    else if (a === 'next'){ if (tourStep >= n - 1) tourFinish(); else { tourStep++; drawTour(); } }
    else if (a === 'skip') tourFinish(); return; }
  const c = e.target.closest && e.target.closest('[data-set]');
  if (c){ const [k, v] = c.dataset.set.split(','); setPath(k, parseFloat(v)); save(); refresh(); return; }
  const f = e.target.closest && e.target.closest('[data-flagset]');
  if (f){ const [k, v] = f.dataset.flagset.split(','); S[k] = v === '1'; save(); refresh(); return; }
  if (e.target.closest && e.target.closest('.tourlink')) tourStep = 0;
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && current === 'tour' && e.target.matches && e.target.matches('#tourBox input')){ e.preventDefault(); const n = $('#tourBox [data-tour="next"]'); if (n) n.click(); }
});

/* ---------- privacy ---------- */
pages.privacy = {
  build(){ return `
    <div><h1>Your numbers are private</h1></div>
    <section class="card"><div class="safebox"><h2>Nothing you type ever leaves this device.</h2>
      <p class="bigtext">Nothing is sent over the internet. Nothing is saved on any website or in any online "cloud". Your numbers stay in this web browser, on the phone, tablet or computer you are using now.</p></div></section>
    <section class="card"><h2>What happens to the numbers you type?</h2>
      <ul class="tidy bigtext">
        <li><b>They are kept on this device only.</b> The app saves them inside this web browser so they are still here when you come back. It is like writing in a notebook that stays in your bag.</li>
        <li><b>They are never sent to anyone.</b> Not to the person who made this app, not to a company, not to a website. There is no account, no sign-in and no email address to give.</li>
        <li><b>Nobody else can look at them online.</b> There is nowhere online for them to be.</li></ul></section>
    <section class="card"><h2>How can you be sure?</h2>
      <ul class="tidy">
        <li>The app has no way to send anything. After the page has opened, it never contacts the internet again.</li>
        <li><b>Try it yourself:</b> once this page is open, turn off your Wi-Fi or switch on aeroplane mode. Everything still works, and nothing is lost.</li>
        <li>The only thing that travels over the internet is the page itself, coming to your device when you open it. That is like borrowing a library book: the library does not see what you write in the margins.</li></ul></section>
    <section class="card"><h2>Things to know</h2>
      <ul class="tidy">
        <li><b>Each device keeps its own numbers.</b> Numbers you type on your phone are not on your computer.</li>
        <li><b>Anyone who uses this same device and web browser could see them.</b> If you share a device, use the button below when you have finished.</li>
        <li><b>If you clear your browser's history or data, or use a private window, your numbers are lost.</b> If you want to keep an answer, take a screenshot.</li>
        <li>This app does not use cookies and does not track you.</li></ul></section>
    <section class="card"><h2>Delete my numbers from this device</h2>
      <p>This removes every number you have typed from this device. It cannot be undone.</p>
      <div><button type="button" class="btn ghost" id="wipe">Delete my numbers</button></div><p id="wipeMsg" class="small" aria-live="polite"></p></section>`; },
  bind(){
    $('#wipe').addEventListener('click', () => {
      const b = $('#wipe');
      if (b.dataset.sure){ wipe(); Object.assign(S, defaultState(), {tourSeen:true}); b.className = 'btn ghost'; b.textContent = 'Delete my numbers'; delete b.dataset.sure;
        $('#wipeMsg').textContent = 'Done. Nothing is saved on this device now.'; return; }
      b.dataset.sure = 1; b.textContent = 'Tap again to delete'; b.className = 'btn danger';
      setTimeout(() => { if (b.isConnected && b.dataset.sure){ delete b.dataset.sure; b.textContent = 'Delete my numbers'; b.className = 'btn ghost'; } }, 5000);
    });
  },
  update(){}
};

/* ---------- state paths ---------- */
function getPath(k){ const [a,b] = k.split('.'); return b===undefined ? S[a] : S[a][+b]; }
function setPath(k, v){ const [a,b] = k.split('.'); if (b===undefined) S[a] = v; else S[a][+b] = v; }

/* ---------- shell ---------- */
let current = 'plan';
function render(){
  const h = (location.hash||'').replace('#','');
  if (!h && !S.tourSeen){ location.replace('#tour'); return; }
  current = pages[h] ? h : 'plan';
  document.querySelectorAll('#tabs a').forEach(a => a.setAttribute('aria-current', a.dataset.p===current ? 'page' : 'false'));
  $('#main').innerHTML = pages[current].build();
  $('#subbar').hidden = !['plan','pot','whatif'].includes(current);
  bindCommon();
  if (pages[current].bind) pages[current].bind();
  refresh();
  window.scrollTo(0,0);
}
function refresh(){
  $('#vE').setAttribute('aria-pressed', S.view==='e'); $('#vI').setAttribute('aria-pressed', S.view==='i');
  $('#viewAmt').textContent = money(budgetOf(S.view)) + ' a month';
  $('#brandSub').textContent = `${nm(0)} and ${nm(1)}`;
  document.querySelectorAll('input[data-flag]').forEach(el => { el.checked = !!S[el.dataset.flag]; });
  document.querySelectorAll('.modeBtn').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === modeOf(S)));
  pages[current].update();
  document.querySelectorAll('.tablewrap table').forEach(cardify);
  document.querySelectorAll('[data-name]').forEach(el => el.textContent = nm(+el.dataset.name));
}
function bindCommon(){
  const main = $('#main');
  main.querySelectorAll('[data-key]').forEach(el => {
    el.addEventListener('input', () => {
      const k = el.dataset.key;
      if (el.type === 'number'){ let v = parseFloat(el.value); S[k.split('.')[0]] !== undefined && setPath(k, isFinite(v) ? Math.max(0, v) : 0); }
      else { if (k.startsWith('dob.') && !el.value) return; setPath(k, el.value); if (k.startsWith('dob.')) S.dobConfirmed = true; }
      save(); refresh();
    });
  });
  main.querySelectorAll('input[data-flag]').forEach(el => el.addEventListener('change', () => { S[el.dataset.flag] = el.checked; save(); refresh(); }));
  const bindNum = (id, fn) => { const el = $('#'+id); if (el) el.addEventListener('input', () => { fn(parseFloat(el.value)); save(); refresh(); }); };
  const lumpNow = () => Math.max(0, S.lump), clamp = v => Math.min(lumpNow(), Math.max(0, isFinite(v) ? v : 0));
  bindNum('split',   v => S.emergency = lumpNow() - clamp(v));
  bindNum('amtInv',  v => S.emergency = lumpNow() - clamp(v));
  bindNum('isaOut',  v => S.emergency = lumpNow() - clamp(v));
  bindNum('amtCash', v => S.emergency = clamp(v));
  bindNum('swr',     v => S.swr = isFinite(v) ? Math.max(0, v) : 0);
  [0,1].forEach(i => { const el = $('#w'+i); if (el) el.addEventListener('input', () => { S.work[i] = +el.value; save(); refresh(); }); });
  const x2 = $('#x2'); if (x2) x2.addEventListener('input', () => { S.extra2 = +x2.value; save(); refresh(); });
  ['gr','cr'].forEach(id => { const el = $('#'+id); if (el) el.addEventListener('input', () => { if (id==='gr') S.growth = +el.value; else S.cashReal = +el.value; save(); refresh(); }); });
  const st = $('#stress'); if (st) st.addEventListener('change', () => refresh());
}
document.addEventListener('click', e => {
  const t = e.target.closest && e.target.closest('[data-try]');
  if (t){ const [p, x] = t.dataset.try.split(',').map(Number); S.work[p] = (S.work[p] || 0) + x; save(); refresh(); return; }
  if (e.target.closest && e.target.closest('[data-clearwork]')){ S.work = [0,0]; save(); refresh(); return; }
});
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('.modeBtn'); if (b){ const m = b.dataset.mode; S.invest = m !== 'cash'; if (m !== 'cash') S.drawdown = (m === 'income'); save(); refresh(); } });
$('#vE').addEventListener('click', () => { S.view = 'e'; save(); refresh(); });
$('#vI').addEventListener('click', () => { S.view = 'i'; save(); refresh(); });
window.addEventListener('hashchange', render);
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (['plan','pot','whatif','lump'].includes(current)) refresh(); }, 150); });
load(); render();
</script>
